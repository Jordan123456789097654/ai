<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 14px;
      margin: 0;
      background: #0d0e15;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #f0a202;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      color: #94a3b8;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #141622;
      border: 1px solid #232738;
      color: #fff;
      padding: 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      background: #f0a202;
      color: #0d0e15;
      border: none;
      padding: 8px;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
    }
    .status {
      margin-top: 8px;
      font-size: 10px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <h2>⚡ Kyro AI Assistant</h2>
  <label>Kyro API Key (PRO+):</label>
  <input type="password" id="apiKey" placeholder="kyro_sk_live_...">
  <button id="saveBtn">Save Settings</button>
  <div className="status" id="statusMsg">Connected to Kyro Gateway</div>

  <script src="popup.js"></script>
</body>
</html>
