# Render Blueprint — provisions the whole Kyro stack in one "New > Blueprint" step.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: redis
    name: kyro-redis
    plan: starter
    ipAllowList: [] # internal-only

  # ── API Gateway ──────────────────────────────────────────────────────────────
  - type: web
    name: kyro-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    preDeployCommand: "npx prisma migrate deploy --schema=./prisma/schema.prisma"
    envVars:
      - key: REDIS_URL
        fromService:
          name: kyro-redis
          type: redis
          property: connectionString
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: API_KEY_PREFIX
        value: kyro_sk_live_
      - key: RATE_LIMIT_FREE
        value: 20
      - key: RATE_LIMIT_PRO
        value: 120
      - key: RATE_LIMIT_ENTERPRISE
        value: 1000
      - key: INFERENCE_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: INFERENCE_MODEL
        value: llama-3.3-70b-versatile
      # ── Set these manually in the Render dashboard ──────────────────────────
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INFERENCE_API_KEY
        sync: false # Set your Groq API key here

  # ── Next.js Web Frontend ─────────────────────────────────────────────────────
  - type: web
    name: kyro-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    plan: starter
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          name: kyro-api
          type: web
          property: url
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
