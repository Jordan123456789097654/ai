# Render Blueprint — provisions the whole backend in one "New > Blueprint" step.
# Docs: https://render.com/docs/blueprint-spec
#
# After this deploys, you still need to:
#   1. Fill in the SUPABASE_* env vars on the kyro-api service (Render can't
#      know these — they come from your Supabase project settings).
#   2. Fill in INFERENCE_BASE_URL with your GPU host's address.
#   3. Run `npx prisma migrate deploy` against the new DB's external URL.
#   4. Set the web app's NEXT_PUBLIC_* vars in Vercel (or add a web service
#      here too — see the commented-out block at the bottom).

databases:
  - name: kyro-db
    plan: starter
    databaseName: kyro
    user: kyro

services:
  - type: redis
    name: kyro-redis
    plan: starter
    ipAllowList: [] # internal-only; only services in this Render project can reach it

  - type: web
    name: kyro-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kyro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: kyro-redis
          type: redis
          property: connectionString
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: API_KEY_PREFIX
        value: kyro_sk_live_
      - key: SUPABASE_URL
        sync: false # set manually in the Render dashboard
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INFERENCE_BASE_URL
        sync: false
      - key: INFERENCE_MODEL
        sync: false
      - key: INFERENCE_API_KEY
        sync: false

